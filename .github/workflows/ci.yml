name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: praxis
          POSTGRES_PASSWORD: praxis
          POSTGRES_DB: praxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U praxis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Write test env
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgresql://praxis:praxis@localhost:5432/praxis_test
          JWT_SECRET=ci-test-secret
          EOF

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://praxis:praxis@localhost:5432/praxis_test

      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
