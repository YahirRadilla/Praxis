databases:
  - name: praxis-db
    plan: free
    region: oregon
    databaseName: praxis
    user: praxis

services:
  - type: web
    name: praxis-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praxis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Filled in once during Blueprint creation (Render prompts for it);
      # get the value from Google Cloud Console > APIs & Services >
      # Credentials, OAuth 2.0 Client ID used by this app.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Cloudflare R2 (S3-compatible object storage for user-uploaded files).
      # Render's free plan has no persistent disk, so uploads are stored
      # here instead of on the container's ephemeral filesystem. Get these
      # from the Cloudflare dashboard: R2 > Manage R2 API Tokens for the
      # account id/access key/secret, and the bucket's Settings tab for its
      # name and public r2.dev (or custom domain) URL.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

  - type: web
    name: praxis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://praxis-backend-abtc.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # React Router client-side routing: let the SPA handle every path
      # instead of Render 404ing on a direct visit to e.g. /proyectos/5.
      - type: rewrite
        source: /*
        destination: /index.html
