databases:
  - name: praxis-db
    plan: free
    region: oregon
    databaseName: praxis
    user: praxis

services:
  - type: web
    name: praxis-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: praxis-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Filled in once during Blueprint creation (Render prompts for it);
      # get the value from Google Cloud Console > APIs & Services >
      # Credentials, OAuth 2.0 Client ID used by this app.
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: praxis-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      # Update this if the backend service ends up at a different
      # *.onrender.com subdomain than expected (check its URL in the
      # Render dashboard after the first deploy).
      - key: VITE_API_URL
        value: https://praxis-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      # React Router client-side routing: let the SPA handle every path
      # instead of Render 404ing on a direct visit to e.g. /proyectos/5.
      - type: rewrite
        source: /*
        destination: /index.html
